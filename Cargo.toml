[package]
name = "local-inference-ngyne"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23"
eframe = "0.37"
egui_commonmark = { version = "0.26", default-features = false, features = ["pulldown_cmark", "better_syntax_highlighting"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
libc = "0.2.191"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
rfd = "0.18"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time"] }

# Smaller, slightly faster binary to install or distribute: `cargo build --profile dist`.
# Slow to build (link-time optimization), so `cargo run --release` stays the quick option.
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
strip = true
